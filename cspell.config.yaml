  # cspell knows "viewport" but not its plural.
  - viewports
  - nosuchfield
  - basenames
  - unredacted
  - safelisted
  - bypassable
  # The errno a read-only container fails to boot with; named in SECURITY.md.
  - EROFS
  # The errno a bind-mount write fails with under a mismatched uid; README.md.
  - EACCES
  # cspell knows "reentrant" but not the noun.
  - reentrancy
  - hostnames
  - unparseable
  # Time-of-check-to-time-of-use; the class of race a symlink swap after
  # discovery validation exploits. Used in scan.ts/scan.test.ts/graphql.test.ts.
  - TOCTOU
  - toctou
  - repointed
ignorePaths:
  - node_modules
  - dist
  # Untracked, per-contributor working notes; not part of the published docs.
  - docs/superpowers
  # Untracked security audit reports; local working artifacts, not published.
  - security
  - build
  - coverage
  - pnpm-lock.yaml
  - "*.min.js"
  - "*.min.css"
