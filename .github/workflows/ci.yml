name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job below repeats this, because Actions does not expand YAML anchors:
#
#   runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
#
# A fork PR runs on GitHub's hardware; everything else runs on ours. The line
# that matters is `pnpm install` plus `pnpm test` plus `docker build` — that is
# arbitrary code from the pull request, and on a self-hosted runner it would be
# arbitrary code on our LAN, beside a beans-web instance that has no
# authentication. Opening a fork PR requires nothing; pushing a branch to this
# repo requires write access, and that is the whole of the trust boundary.
#
# On a push to main the pull_request context is absent, so the expression falls
# through to self-hosted, which is correct: that ref is already merged.
jobs:
  lint:
    name: Lint
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format

      - name: Lint (zero warnings)
        run: pnpm lint

  audit:
    name: Audit
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

  typecheck:
    name: Typecheck
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test (coverage)
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Read the pinned Go toolchain version
        id: go-version
        run: |
          # The Dockerfile's FROM line is the single source of truth for the
          # Go toolchain that builds beans; deriving it here (rather than
          # "stable") means CI compiles with the identical Go patch the image
          # uses, so a stdlib CVE fixed only in a newer patch can't ship clean
          # while CI still tests an older one.
          GO_VERSION="$(sed -n 's/^FROM golang:\([^-]*\)-bookworm AS beans-builder$/\1/p' Dockerfile)"
          test -n "$GO_VERSION" || { echo "could not read the Go version from Dockerfile"; exit 1; }
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: false

      - name: Install beans
        run: |
          # The Dockerfile's ARG is the single source of truth for the beans
          # version pin, its FROM line pins the Go toolchain (read above), and
          # scripts/build-beans.sh is the single source of truth for the
          # dependency overrides that patch upstream's go.mod — together
          # these guarantee this builds the exact same binary the image ships.
          BEANS_VERSION="$(sed -n 's/^ARG BEANS_VERSION=//p' Dockerfile)"
          test -n "$BEANS_VERSION" || { echo "could not read BEANS_VERSION from Dockerfile"; exit 1; }
          bash scripts/build-beans.sh "$BEANS_VERSION" "$(go env GOPATH)/bin/beans"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      - name: Run full test suite with coverage (unit + integration)
        run: pnpm -r test:coverage

      # codecov-action's `flags` applies to every file in a single upload as one
      # group, not positionally per file, so each package gets its own step to
      # keep coverage flags scoped correctly per package.
      - name: Upload coverage to Codecov (shared)
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/shared/coverage/lcov.info
          flags: shared
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (server)
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/server/coverage/lcov.info
          flags: server
          fail_ci_if_error: false

      - name: Upload coverage to Codecov (web)
        if: always()
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/web/coverage/lcov.info
          flags: web
          fail_ci_if_error: false

      - name: Upload test results to Codecov (shared)
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./packages/shared/test-report.junit.xml
          flags: shared

      - name: Upload test results to Codecov (server)
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/server/test-report.junit.xml
          flags: server

      - name: Upload test results to Codecov (web)
        if: ${{ !cancelled() }}
        uses: codecov/test-results-action@0fa95f0e1eeaafde2c782583b36b28ad0d8c77d3 # v1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./apps/web/test-report.junit.xml
          flags: web

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-report
          path: "**/coverage/"
          retention-days: 14

  e2e:
    name: E2E
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Read the pinned Go toolchain version
        id: go-version
        run: |
          # The Dockerfile's FROM line is the single source of truth for the
          # Go toolchain that builds beans; deriving it here (rather than
          # "stable") means CI compiles with the identical Go patch the image
          # uses, so a stdlib CVE fixed only in a newer patch can't ship clean
          # while CI still tests an older one.
          GO_VERSION="$(sed -n 's/^FROM golang:\([^-]*\)-bookworm AS beans-builder$/\1/p' Dockerfile)"
          test -n "$GO_VERSION" || { echo "could not read the Go version from Dockerfile"; exit 1; }
          echo "version=$GO_VERSION" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.go-version.outputs.version }}
          cache: false

      - name: Install beans
        run: |
          # The Dockerfile's ARG is the single source of truth for the beans
          # version pin, its FROM line pins the Go toolchain (read above), and
          # scripts/build-beans.sh is the single source of truth for the
          # dependency overrides that patch upstream's go.mod — together
          # these guarantee this builds the exact same binary the image ships.
          BEANS_VERSION="$(sed -n 's/^ARG BEANS_VERSION=//p' Dockerfile)"
          test -n "$BEANS_VERSION" || { echo "could not read BEANS_VERSION from Dockerfile"; exit 1; }
          bash scripts/build-beans.sh "$BEANS_VERSION" "$(go env GOPATH)/bin/beans"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - run: pnpm install --frozen-lockfile

      # No --with-deps: that shells out to sudo to install system libraries, and
      # the runners have no passwordless sudo. The libraries are already part of
      # the runner image; only the browser build itself, which lands in the
      # user's cache, has to track the pinned Playwright version.
      - name: Install Playwright browser
        run: pnpm --filter @beans-web/web exec playwright install chromium

      - name: Run e2e tests
        run: pnpm --filter @beans-web/web e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 14

  build:
    name: Build
    needs: [lint, typecheck]
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      contents: read
    env:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r build

  quality:
    name: Quality
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check for unused code
        run: pnpm knip

      - name: Spell check
        run: pnpm spell

      # The beans CLI pin lives only in the Dockerfile's ARG; compose and CI
      # both derive it. Fails if a competing literal pin reappears in a build input.
      - name: Check the beans version pin has one source
        run: pnpm check:pins

      # Regenerates in place and fails on any diff, so a hand-edited or stale
      # generated.ts cannot reach main. Run `pnpm codegen:check` locally to fix.
      - name: Check generated GraphQL types are current
        run: pnpm codegen:check

  image-scan:
    name: Image Scan
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the production image
        run: docker build -t beans-web:ci .

      # Fails the build on any fixable HIGH or CRITICAL. Suppressions live in
      # .trivyignore and must carry a reason and an expiry date.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: beans-web:ci
          format: table
          exit-code: "1"
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore

  # zizmor audits the workflows and gitleaks reads the whole history for
  # secrets. Both fail the job on any finding and send their results to code
  # scanning. Nothing from the pull request is installed or run here, so this
  # is the one job that can hold security-events: write.
  repo-scan:
    name: Repo Scan
    runs-on: ${{ github.event.pull_request.head.repo.fork && 'ubuntu-latest' || 'self-hosted' }}
    permissions:
      contents: read
      security-events: write # to upload the SARIF results to code scanning
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks reads the whole history
          persist-credentials: false

      # Each tool is a release download checked against its SHA-256. The
      # "# renovate:" comment tells Renovate where VERSION comes from, and it
      # changes VERSION and SHA256 together (see renovate.json).
      - name: Install zizmor
        env:
          # renovate: datasource=github-release-attachments depName=zizmorcore/zizmor
          VERSION: v1.31.1
          SHA256: d185f726bdaf92df78273217dfdd24ebcd6b0ef48cf3ce776ff5762b6e138c99
        run: |
          curl -sSfL -o zizmor.tar.gz "https://github.com/zizmorcore/zizmor/releases/download/${VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${SHA256}  zizmor.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf zizmor.tar.gz -C "$RUNNER_TEMP/bin" zizmor
          rm zizmor.tar.gz
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install gitleaks
        env:
          # renovate: datasource=github-release-attachments depName=gitleaks/gitleaks
          VERSION: v8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/${VERSION}/gitleaks_${VERSION#v}_linux_x64.tar.gz"
          echo "${SHA256}  gitleaks.tar.gz" | sha256sum --check
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/bin" gitleaks
          rm gitleaks.tar.gz

      # With GH_TOKEN set, zizmor also runs its online audits.
      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p sarif
          zizmor --format sarif .github/workflows/*.yml > sarif/zizmor.sarif || true
          zizmor .github/workflows/*.yml

      - name: Scan the history for secrets
        if: ${{ !cancelled() }}
        run: |
          mkdir -p sarif
          gitleaks git --redact --no-banner --exit-code 1 --report-format sarif --report-path sarif/gitleaks.sarif .

      # A fork pull request's token cannot write to code scanning.
      - name: Upload zizmor results
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: sarif/zizmor.sarif
          category: zizmor

      - name: Upload gitleaks results
        if: ${{ !cancelled() && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: sarif/gitleaks.sarif
          category: gitleaks
