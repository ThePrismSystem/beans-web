# Runs beans-web standalone. Point the bind mount below at your projects
# directory, then `docker compose up -d` and visit http://localhost:4780.
#
# To put it behind Traefik instead, uncomment the networks and labels blocks at
# the bottom and swap the published port for `expose`. See the Docker section of
# README.md for configuration, volume ownership, and security notes.

services:
  beans-web:
    build:
      context: .
      dockerfile: Dockerfile
      # No BEANS_VERSION override here on purpose. A build arg silently wins
      # over the Dockerfile's ARG default, so pinning it in both places meant
      # bumping the Dockerfile alone shipped the old binary. The Dockerfile is
      # the single source of truth; CI reads the pin from it too.
    image: beans-web:latest
    container_name: beans-web
    restart: unless-stopped

    # The image already runs as non-root (`USER node`, uid 1000 — see Dockerfile).
    # Uncomment and set this ONLY if the host user that owns your git projects is
    # not uid 1000; otherwise beans written through the UI land with the wrong
    # owner and edits fail with EACCES on the bind mount below.
    # Find yours with: id -u
    # user: "1001:1001"

    read_only: true
    tmpfs:
      - /tmp
      # Corepack lazily downloads/verifies the pinned pnpm version into this
      # cache on first run; without it the container fails to boot (EROFS).
      - /home/node/.cache
    cap_drop: [ALL]
    security_opt:
      - "no-new-privileges:true"

    environment:
      GIT_ROOT: /projects # comma-separated scan root(s) inside the container (matches the mount below)
      SCAN_DEPTH: "1" # each immediate subdir with a .beans.yml is one project
      HOST: 0.0.0.0 # must bind all interfaces inside the container
      PORT: "4780"
      NODE_ENV: production
      BEANS_BIN: beans # the static beans binary baked into the image (on PATH)
      TRUST_PROXY: "false" # set to "true" when a reverse proxy is the only ingress
      # ALLOWED_HOSTS: beans.example.com # required when reaching the UI by hostname or LAN IP, not just localhost
      # With TRUST_PROXY=true, also list any internal host the proxy rewrites
      # Host to before forwarding (e.g. this service's name) -- both the
      # connection host and the forwarded one must be allowed, comma-separated.

    volumes:
      # READ-WRITE on purpose: the UI creates / edits / scraps beans, which
      # writes to the on-disk .beans files. Point the left side at your projects.
      - /home/youruser/git:/projects

    # Loopback-only by default: this UI has no authentication, so anything
    # reachable can read and write every mounted project. Widening this
    # requires an authenticating proxy in front (see the Traefik section
    # below) and, once reached by hostname or LAN IP, ALLOWED_HOSTS set.
    ports:
      - "127.0.0.1:4780:4780"

    # Behind Traefik, drop the published port and expose it to the proxy network
    # instead:
    # expose:
    #   - "4780"

    # --- Traefik (adapt entrypoints / certresolver / network to your stack) ---
    # networks:
    #   - traefik
    # labels:
    #   traefik.enable: "true"
    #   traefik.http.routers.beans.rule: "Host(`beans.example.com`)"
    #   traefik.http.routers.beans.entrypoints: "websecure"
    #   traefik.http.routers.beans.tls.certresolver: "letsencrypt"
    #   traefik.http.services.beans.loadbalancer.server.port: "4780"
    #   # STRONGLY recommended: this UI reads AND writes your project data, so it
    #   # must not be exposed unauthenticated. Protect it with your SSO middleware:
    #   traefik.http.routers.beans.middlewares: "authelia@docker"

# networks:
#   traefik:
#     external: true
